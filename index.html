<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>HELLO WORLD Animado</title>
  <link rel="stylesheet" href="estilos.css" />
</head>

<body>

  <!-- Imagen de fondo -->
  <div class="background"></div>

  <!-- Panel negro izquierdo -->
  <div class="panel negro"></div>

  <!-- Panel verde derecho -->
  <div class="panel verde"></div>

  <!-- FORMULARIO -->
  <div class="form-container">
    <div class="card">

      <!-- Switcher -->
      <div class="switcher">
        <button class="switch-btn active" data-target="signup">Registrarse</button>
        <button class="switch-btn" data-target="signin">Iniciar Sesión</button>
      </div>

      <!-- FORMULARIOS -->
      <form class="form form-signup active" novalidate>

        <div class="inputBox1">
          <input type="text" required>
          <span>Email</span>
        </div>

        <div class="inputBox">
          <input type="text" required>
          <span>CC</span>
        </div>

        <div class="inputBox">
          <input type="password" required>
          <span>Contraseña</span>
        </div>

        <button class="enter">Crear cuenta</button>
      </form>

      <form class="form form-signin hidden" novalidate>

        <div class="inputBox">
          <input type="text" required>
          <span>CC o Email</span>
        </div>

        <div class="inputBox">
          <input type="password" required>
          <span>Contraseña</span>
        </div>

        <button class="enter">Iniciar Sesión</button>
      </form>

    </div>
  </div>

  <!-- Script tabs -->
  <script>
    document.addEventListener("DOMContentLoaded", () => {
      const buttons = document.querySelectorAll(".switch-btn");
      const signup = document.querySelector(".form-signup");
      const signin = document.querySelector(".form-signin");

      buttons.forEach(btn => {
        btn.addEventListener("click", () => {
          buttons.forEach(b => b.classList.remove("active"));
          btn.classList.add("active");

          const target = btn.dataset.target;

          if (target === "signup") {
            signup.classList.add("active");
            signup.classList.remove("hidden");

            signin.classList.remove("active");
            signin.classList.add("hidden");
          } else {
            signin.classList.add("active");
            signin.classList.remove("hidden");

            signup.classList.remove("active");
            signup.classList.add("hidden");
          }
        });
      });
    });
  </script>

</body>
</html>
